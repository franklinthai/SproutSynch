# Redis configuration file for SproutSynch
# Basic configuration suitable for Raspberry Pi

# Network
bind 127.0.0.1
port 6379
protected-mode yes

# Performance
maxmemory 100mb
maxmemory-policy allkeys-lru
timeout 0
tcp-keepalive 300

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
dir /var/lib/redis

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# SproutSynch specific settings
databases 2    # Use DB 0 for plant cache, DB 1 for sensor data
